*{box-sizing:border-box}
html{scroll-behavior:smooth;scroll-padding-top:90px}
body{margin:0;background:var(--bg);color:var(--ink);font:400 .95rem/1.7 Poppins,system-ui,sans-serif}
a{color:var(--pop)}
a:focus-visible,button:focus-visible{outline:3px solid var(--sun);outline-offset:2px}
h1,h2,h3{font-family:Outfit,system-ui,sans-serif;font-weight:600;margin:0;line-height:1.2}
h1 span,h2 span{color:var(--pop)}
.wrap{max-width:1080px;margin:0 auto;padding:0 1.25rem}
nav{position:sticky;top:10px;z-index:9;padding:0 1rem}
.pill{max-width:1080px;margin:10px auto 0;background:#fff;border-radius:40px;display:flex;align-items:center;gap:1rem;padding:.5rem .55rem .5rem 1rem;box-shadow:0 6px 30px #0007}
.brand{display:flex;align-items:center;gap:.5rem;font:600 1.4rem Outfit,sans-serif;color:var(--pop);text-decoration:none;flex:none}
.brand b{width:34px;height:34px;border-radius:50%;background:var(--pop);color:#fff;font-size:.85rem;display:grid;place-items:center}
.nl{flex:1;min-width:0;display:flex;gap:1.2rem;justify-content:center;overflow-x:auto;white-space:nowrap;scrollbar-width:none}
.nl a{color:#111;text-decoration:none;font-weight:500;font-size:.88rem}
.nl a:hover{color:var(--pop)}
.btn{display:inline-block;padding:.55rem 1.3rem;border-radius:30px;border:1px solid var(--pop);color:var(--pop);text-decoration:none;font-weight:500;font-size:.88rem}
.btn.main{background:var(--pop);color:#fff}
.hero{display:grid;grid-template-columns:5fr 6fr;gap:3.5rem;align-items:center;padding:4rem 0}
header.hasbg{background-size:cover;background-position:center;position:relative}
header.hasbg::before{content:"";position:absolute;inset:0;background:var(--bg);opacity:.85}
header .wrap{position:relative}
.pic{position:relative;width:min(100%,430px);aspect-ratio:1;margin:0 auto}
.pic::before,.pic::after{content:"";position:absolute;border-radius:50%}
.pic::before{width:26%;aspect-ratio:1;background:var(--pop);top:-3%;left:-5%}
.pic::after{width:17%;aspect-ratio:1;background:var(--sun);right:-3%;bottom:9%;z-index:2}
.photo{position:relative;z-index:1;width:100%;height:100%;border-radius:50%;object-fit:cover;border:6px solid var(--pop);background:var(--card)}
.photo.ph{display:grid;place-items:center;font:600 4rem Outfit,sans-serif;color:var(--pop)}
.badge{display:inline-block;border:1px solid var(--pop);border-radius:20px;padding:.1rem .95rem;font-size:.82rem;margin-bottom:1rem}
h1{font-size:clamp(2rem,4.6vw,3.1rem)}
.roles{margin:.7rem 0 0;font-weight:500;color:var(--sun)}
.tagline{color:var(--mute);margin:1rem 0 1.4rem;max-width:56ch}
.info{background:var(--card);border-radius:8px;padding:1.1rem 1.3rem;display:grid;grid-template-columns:1fr 1fr;gap:.9rem 1.5rem;margin-bottom:1.5rem}
.info div{min-width:0;overflow-wrap:anywhere;font-size:.88rem}
.info small{display:block;color:var(--pop);font-weight:500}
.info a{color:var(--ink)}
.btns{display:flex;flex-wrap:wrap;gap:.8rem}
.s{padding:3.5rem 0}
.s:nth-of-type(even){background:var(--bg2)}
h2{font-size:clamp(1.7rem,4vw,2.2rem);text-align:center}
.sub{text-align:center;color:var(--mute);max-width:60ch;margin:.7rem auto 0}
h2+*{margin-top:2rem}h2+.sub{margin-top:.7rem}.sub+*{margin-top:2rem}
.cat{color:var(--pop);font-weight:500;margin:1.6rem 0 .8rem;font-size:.9rem;text-transform:uppercase;letter-spacing:.06em}
.skills{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:1rem}
.sk{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:1.1rem .6rem;text-align:center;font:500 .95rem Outfit,sans-serif;overflow-wrap:anywhere}

.item{min-width:0;overflow-wrap:break-word;background:var(--card);border:1px solid var(--line);border-left:3px solid var(--pop);border-radius:8px;padding:1.2rem 1.3rem;margin-bottom:1rem}

.meta{color:var(--sun);font-size:.85rem;margin:.2rem 0 .6rem}
.item p{margin:0;color:var(--mute)}
.item ul{margin:.6rem 0 0;padding-left:1.2rem;color:var(--mute)}
.item li{margin:.25rem 0}
.item>img{width:100%;max-height:260px;object-fit:cover;border-radius:6px;margin-bottom:.9rem;border:1px solid var(--line)}
.head{display:flex;flex-wrap:wrap;gap:.8rem 1rem;align-items:center;margin-bottom:.5rem}
.head>div{flex:1 1 220px;min-width:0}
.head .meta{margin:.2rem 0 0}
.logo{height:56px;width:auto;max-width:200px;object-fit:contain;background:#fff;border-radius:8px;padding:4px;flex:none}
.logo.ph{width:56px;display:grid;place-items:center;font:600 1.1rem Outfit,sans-serif;color:var(--pop)}
.tags{display:flex;flex-wrap:wrap;gap:.4rem;margin-top:.8rem}
.tags span{background:#1c1c30;padding:.1rem .7rem;border-radius:99px;font-size:.8rem}
.tags span img{width:16px;height:16px;vertical-align:-3px;margin-right:.35rem;background:#fff;border-radius:3px;padding:1px}
.links{display:flex;flex-wrap:wrap;gap:.6rem;margin-top:.9rem}
.links a{border:1px solid var(--pop);border-radius:20px;padding:.15rem .9rem;font-size:.85rem;text-decoration:none}
.links a:hover{background:var(--pop);color:#fff}

.certs .item{margin:0}
.lab{background:var(--card);border:1px solid var(--line);border-left:3px solid var(--sun);border-radius:8px;padding:1.3rem 1.4rem;margin-bottom:1.2rem;min-width:0;overflow-wrap:break-word}
.lab h3{font-size:1.25rem;font-weight:500}
.lab .meta{color:var(--sun);font-size:.85rem;margin:.2rem 0 1rem}
.lab h4{font-size:.8rem;text-transform:uppercase;letter-spacing:.06em;color:var(--pop);margin:1rem 0 .4rem}
.lab h4:first-of-type{margin-top:0}
.lab p{margin:0;color:var(--mute)}
.lab ul{margin:.3rem 0 0;padding-left:1.2rem;color:var(--mute)}
.lab li{margin:.2rem 0}
.lab>img{width:100%;max-height:280px;object-fit:cover;border-radius:6px;margin-bottom:1rem;border:1px solid var(--line)}
.filters{display:flex;flex-wrap:wrap;gap:.5rem;justify-content:center;margin-bottom:1.5rem}
.filters button{font:inherit;font-size:.85rem;background:none;border:1px solid var(--pop);color:var(--pop);padding:.25rem 1.1rem;border-radius:99px;cursor:pointer}

.more{text-align:center;margin-top:1.5rem}
.stars{color:var(--pop);letter-spacing:.2em}
footer{background:var(--bg);border-top:1px solid var(--line);padding:3rem 0 1.5rem}
.fg{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:2rem}
footer h3{font-size:1rem;font-weight:500;margin-bottom:.8rem}

footer a{display:block;text-decoration:none;margin:.3rem 0;overflow-wrap:anywhere}

.copy{border-top:1px solid var(--line);margin-top:2rem;padding-top:1.2rem;color:var(--mute);font-size:.85rem}

@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}}
</style>

<header id="top"><div class="wrap"><div class="hero">
  <div class="pic" id="photo"></div>
  <div>
    <span class="badge">Portfolio</span>
    <h1 id="name"></h1>
    <p class="roles" id="roles"></p>
    <p class="tagline" id="tagline"></p>
    <div class="info" id="info"></div>
    <div class="btns" id="btns"></div>
  </div>
</div></div></header>

<main id="main"></main>

<footer id="contact"><div class="wrap">
  <div class="fg" id="fg"></div>
  <div class="copy" id="copy"></div>
</div></footer>

<script>
const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const hi = s => esc(s).replace(/(\S+)$/, "<span>$1</span>");   // last word in orange
const ini = s => String(s || "").split(/[\s,&]+/).filter(w => /^[A-Za-z]/.test(w)).slice(0, 2).map(w => w[0].toUpperCase()).join("");
const ph = (el, cls) => { const p = el.getAttribute("src"); if (EMBED[p] && !el.dataset.t) { el.dataset.t = 1; el.src = EMBED[p]; return; } const d = document.createElement("div"); d.className = cls + " ph"; d.textContent = el.dataset.i; el.replaceWith(d); };
const iconSrc = n => { const v = ICONS[n]; if (!v) return ""; return /[\/.]/.test(v) ? v : `https://cdn.jsdelivr.net/gh/devicons/devicon@v2.16.0/icons/${v}/${v}-original.svg`; };
const linksHtml = ls => ls && ls.length ? `<div class="links">${ls.map(l => `<a href="${esc(l.url)}" target="_blank" rel="noopener">${esc(l.label)}</a>`).join("")}</div>` : "";
const tagsHtml = t => t && t.length ? `<div class="tags">${t.map(x => { const s = iconSrc(x); return `<span>${s ? `<img src="${esc(s)}" alt="" onerror="this.remove()">` : ""}${esc(x)}</span>`; }).join("")}</div>` : "";
const metaHtml = i => `<div class="meta">${[i.org, i.dates].filter(Boolean).map(esc).join(" | ")}</div>`;
const item = i => `<article class="item" data-cat="${esc(i.category || "")}">
  ${i.image ? `<img src="${esc(i.image)}" alt="${esc(i.title)}" loading="lazy">` : ""}
  ${i.logo ? `<div class="head"><img class="logo" src="${esc(i.logo)}" alt="" data-i="${esc(ini(i.org))}" onerror="ph(this,'logo')"><div><h3>${esc(i.title)}</h3>${metaHtml(i)}</div></div>` : `<h3>${esc(i.title)}</h3>${metaHtml(i)}`}
  ${i.description ? `<p>${esc(i.description)}</p>` : ""}
  ${i.points && i.points.length ? `<ul>${i.points.map(p => `<li>${esc(p)}</li>`).join("")}</ul>` : ""}
  ${tagsHtml(i.tags)}${linksHtml(i.links)}
</article>`;
const list = a => a && a.length ? a.map(item).join("") : "";
const skill = n => { const s = iconSrc(n); return `<div class="sk">${s ? `<img src="${esc(s)}" alt="" onerror="this.outerHTML='<i>${esc(n[0])}</i>'">` : `<i>${esc(n[0])}</i>`}${esc(n)}</div>`; };
const lab = l => `<article class="lab">
  ${l.image ? `<img src="${esc(l.image)}" alt="${esc(l.title)}" loading="lazy" onerror="this.remove()">` : ""}
  <h3>${esc(l.title)}</h3>
  <div class="meta">${[l.platform, l.dates].filter(Boolean).map(esc).join(" | ")}</div>
  <h4>Problem</h4><p>${esc(l.problem)}</p>
  ${l.approach && l.approach.length ? `<h4>Approach</h4><ul>${l.approach.map(p => `<li>${esc(p)}</li>`).join("")}</ul>` : ""}
  ${tagsHtml(l.tools)}
  ${l.lessons && l.lessons.length ? `<h4>Key lessons</h4><ul>${l.lessons.map(p => `<li>${esc(p)}</li>`).join("")}</ul>` : ""}
  ${linksHtml(l.links)}
</article>`;
const svc = s => `<article class="svc"><h3>${esc(s.title)}</h3><div><p style="margin:0">${esc(s.text)}</p>${tagsHtml(s.tags)}</div><a class="go" href="${esc(s.link || "#projects")}" aria-label="${esc(s.title)}">&#8599;</a></article>`;

const D = DATA, C = D.contact;
document.title = `${D.name} | Portfolio`;
$("brand").innerHTML = `<b>${esc(ini(D.name))}</b>${esc(D.name.split(" ").slice(-1)[0])}`;
$("talk").href = `mailto:${C.email}`;
$("name").textContent = D.name;
$("roles").textContent = D.roles.join("  |  ");
$("tagline").textContent = D.tagline;
$("photo").innerHTML = D.photo
  ? `<img class="photo" src="${esc(D.photo)}" alt="Portrait of ${esc(D.name)}" data-i="${esc(ini(D.name))}" onerror="ph(this,'photo')">`
  : `<div class="photo ph">${esc(ini(D.name))}</div>`;
if (D.heroBackground) { const h = $("top"); h.classList.add("hasbg"); h.style.backgroundImage = `url("${D.heroBackground}")`; }

const handle = u => "@" + String(u).replace(/\/+$/, "").split("/").pop();
$("info").innerHTML = [
  ["Name", esc(D.name)],
  ["Phone", C.phone && `<a href="tel:${esc(C.phone)}">${esc(C.phone)}</a>`],
  ["Email", C.email && `<a href="mailto:${esc(C.email)}">${esc(C.email)}</a>`],
  ["Location", esc(C.location)],
  ["LinkedIn", C.linkedin && `<a href="${esc(C.linkedin)}" target="_blank" rel="noopener">View profile</a>`],
  ["GitHub", C.github && `<a href="${esc(C.github)}" target="_blank" rel="noopener">${esc(handle(C.github))}</a>`]
].filter(r => r[1]).map(r => `<div><small>${r[0]}</small>${r[1]}</div>`).join("");
$("btns").innerHTML = `<a class="btn main" href="mailto:${esc(C.email)}">Contact me</a>` +
  (C.cv ? `<a class="btn" href="${esc(C.cv)}" target="_blank" rel="noopener">Download my resume</a>` : "") +
  (C.github ? `<a class="btn" href="${esc(C.github)}" target="_blank" rel="noopener">My GitHub</a>` : "");

const S = [];
const add = (id, label, title, html, sub) => { if (html) S.push({id, label, title, html, sub}); };
add("skills", "Skills", "My Work Skills",
  Object.entries(D.skills).map(([k, v]) => `<div class="cat">${esc(k)}</div><div class="skills">${v.map(skill).join("")}</div>`).join(""),
  "The languages, tools and technologies I work with.");
add("services", "What I Do", "What I Do", D.services && D.services.length ? `<div class="svcs">${D.services.map(svc).join("")}</div>` : "", D.about);
add("experience", "Experience", "My Experience", list(D.experience));
const cats = [...new Set(D.projects.map(p => p.category).filter(Boolean))];
add("projects", "Projects", "My Projects",
  (cats.length > 1 ? `<div class="filters" id="filters"><button aria-pressed="true" data-f="">All</button>${cats.map(c => `<button aria-pressed="false" data-f="${esc(c)}">${esc(c)}</button>`).join("")}</div>` : "") +
  `<div id="projlist">${list(D.projects)}</div>` +
  (C.github ? `<div class="more"><a class="btn main" href="${esc(C.github)}" target="_blank" rel="noopener">See all projects on GitHub</a></div>` : ""));
add("labs", "Lab Challenges", "Lab Challenges", D.labs && D.labs.length ? D.labs.map(lab).join("") : "", "Hands-on penetration-testing exercises from my Cyber Shujaa Security Analyst training on Hack The Box.");
add("certifications", "Certifications", "My Certifications", D.certifications && D.certifications.length ? `<div class="certs">${list(D.certifications)}</div>` : "");
add("training", "Training", "Ongoing Training", D.training && D.training.length ? `<div class="certs">${list(D.training)}</div>` : "");
add("community", "Community", "Student Tech Community", list(D.community));
add("education", "Education", "My Education", list(D.education));
add("testimonials", "Testimonials", "What People Say", D.testimonials && D.testimonials.length ?
  `<div class="certs">${D.testimonials.map(t => `<article class="item"><div class="stars">&#9733;&#9733;&#9733;&#9733;&#9733;</div><p>${esc(t.text)}</p><div class="meta">${esc(t.name)}${t.role ? " | " + esc(t.role) : ""}</div></article>`).join("")}</div>` : "");

$("main").innerHTML = S.map(s => `<section class="s" id="${s.id}"><div class="wrap"><h2>${hi(s.title)}</h2>${s.sub ? `<p class="sub">${esc(s.sub)}</p>` : ""}${s.html}</div></section>`).join("");
const navItems = [["top", "Home"], ...S.map(s => [s.id, s.label]), ["contact", "Contact"]];
$("nav").innerHTML = navItems.map(n => `<a href="#${n[0]}">${esc(n[1])}</a>`).join("");

const f = $("filters");
if (f) f.addEventListener("click", e => {
  const b = e.target.closest("button"); if (!b) return;
  f.querySelectorAll("button").forEach(x => x.setAttribute("aria-pressed", x === b));
  document.querySelectorAll("#projlist .item").forEach(el => el.hidden = b.dataset.f && el.dataset.cat !== b.dataset.f);
});

$("fg").innerHTML =
  `<div><h3>Navigation</h3>${navItems.map(n => `<a href="#${n[0]}">${esc(n[1])}</a>`).join("")}</div>` +
  `<div><h3>Contact</h3>${[C.phone && `<a href="tel:${esc(C.phone)}">${esc(C.phone)}</a>`, C.email && `<a href="mailto:${esc(C.email)}">${esc(C.email)}</a>`, C.location && `<p>${esc(C.location)}</p>`].filter(Boolean).join("")}</div>` +
  `<div><h3>Connect</h3>${[C.linkedin && `<a href="${esc(C.linkedin)}" target="_blank" rel="noopener">LinkedIn</a>`, C.github && `<a href="${esc(C.github)}" target="_blank" rel="noopener">GitHub</a>`, C.cv && `<a href="${esc(C.cv)}" target="_blank" rel="noopener">Download CV</a>`].filter(Boolean).join("")}</div>`;
$("copy").textContent = `Copyright \u00A9 ${new Date().getFullYear()} ${D.name}. All rights reserved.`;
</script>
</body>
</html>
